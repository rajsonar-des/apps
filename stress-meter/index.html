<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:,">
<title>Stress Meter</title>
<meta name="description" content="Stress Meter: a calm companion that reads your body and work rhythm and nudges you to rest before burnout.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&amp;family=Hanken+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#06874c}a:hover{color:#056b3c}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #06874c;outline-offset:2px}
.sm-enter{animation:smEnter 300ms cubic-bezier(.2,.8,.2,1) both}
.sm-fade{animation:smFade 480ms ease-out both}
.sm-modal{animation:smModal 380ms cubic-bezier(.2,.8,.2,1) both}
.sm-toast{animation:smToast 280ms cubic-bezier(.2,.8,.2,1) both}
.sm-sheet-in{animation:smSheetIn 320ms cubic-bezier(.2,.8,.2,1) both}
.sm-sheet-out{animation:smSheetOut 200ms ease-in both}
.sm-scrim-in{animation:smFade 240ms ease-out both}
.sm-scrim-out{animation:smFadeOut 200ms ease-in both}
.sm-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:smDraw 900ms ease-out 150ms forwards}
.sm-grow{transform-origin:bottom;animation:smGrow 640ms cubic-bezier(.2,.8,.2,1) both}
.sm-breathe{animation:smBreathe 10s ease-in-out infinite}
.sm-press{transition:transform 120ms ease-out,background-color 200ms ease,border-color 200ms ease,color 200ms ease}
.sm-press:active{transform:scale(.97)}
.sm-hero{transition:background-color 500ms ease}
.sm-bar{transition:width 300ms linear}
.sm-ring{transition:box-shadow 220ms ease}
.sm-in-fwd{animation:smInFwd 320ms cubic-bezier(.2,.8,.2,1) both}
.sm-in-back{animation:smInBack 320ms cubic-bezier(.2,.8,.2,1) both}
.sm-out-fwd{animation:smOutFwd 240ms ease-in both;pointer-events:none}
.sm-out-back{animation:smOutBack 240ms ease-in both;pointer-events:none}
.sm-modal-out{animation:smModalOut 250ms ease-in both;pointer-events:none}
.sm-toast-out{animation:smFadeOut 220ms ease-in both}
@keyframes smInFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes smInBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes smOutFwd{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-28px)}}
@keyframes smOutBack{from{opacity:1;transform:none}to{opacity:0;transform:translateX(28px)}}
@keyframes smModalOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(48px)}}
@keyframes smEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes smFade{from{opacity:0}to{opacity:1}}
@keyframes smFadeOut{from{opacity:1}to{opacity:0}}
@keyframes smModal{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes smToast{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes smSheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes smSheetOut{from{transform:none}to{transform:translateY(100%)}}
@keyframes smDraw{to{stroke-dashoffset:0}}
@keyframes smGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes smBreathe{0%{transform:scale(.86)}40%{transform:scale(1)}100%{transform:scale(.86)}}
@media (prefers-reduced-motion: reduce){
*{animation:none !important;transition:none !important}
.sm-draw{stroke-dashoffset:0}
}
</style>
<style>
html,body{height:100%;background:#eef2ef}
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box}
#phone{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(18,22,20,.35),0 0 0 1px #e4e9e5;transform-origin:top center;background:#fff}
@media (max-width:430px){html,body{background:#fff}#stage{padding:0;align-items:flex-start}#phone{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div id="stage"><div id="phone"><div style="height:100%;display:flex;align-items:center;justify-content:center;padding:40px;box-sizing:border-box;text-align:center;font:15px/22px -apple-system,system-ui,sans-serif;color:#4f5854">The app could not start here. This preview is blocking scripts. Open index.html in Chrome or Safari, or publish it with GitHub Pages.</div></div></div>

<template id="app-template">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; color: #121614; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif">

<sc-if value="{{showTabs}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden">

<sc-if value="{{showHome}}" hint-placeholder-val="{{ true }}">
<div class="{{homeCls}}" style="position: absolute; inset: 0; display: flex; flex-direction: column; isolation: isolate">
<sc-for list="{{grads}}" as="g" hint-placeholder-count="5">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 450px; z-index: -1; background: {{g.bg}}; opacity: {{g.op}}; transition: opacity 600ms ease"></div>
</sc-for>

<header style="padding: 58px 20px 0">
<h1 style="margin: 0; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; font-size: 20px; line-height: 26px; font-weight: 400; letter-spacing: -0.005em; color: #4f5854">{{greeting}}, Raj</h1>
</header>

<section aria-label="Your state" style="margin-top: 20px; flex: none; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 20px; min-height: 40px">
<div>
<sc-for list="{{heroes}}" as="h" hint-placeholder-count="1">
<sc-if value="{{h.show}}" hint-placeholder-val="{{ true }}">
<div class="sm-enter" style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Hanken Grotesk', sans-serif; font-size: 34px; line-height: 40px; font-weight: 600; letter-spacing: -0.035em; color: {{h.color}}">{{h.name}}</h2>
</div>
</sc-if>
</sc-for>
</div>
</section>
<div style="position: relative; height: 262px; margin-top: 6px; flex: none">
<button type="button" class="sm-press" onClick="{{nextMood}}" aria-label="Show next state" style="position: absolute; left: 50%; bottom: 0; width: 202px; height: 262px; margin-left: -101px; padding: 0; border: 0; background: transparent; cursor: pointer">
<sc-if value="{{isMood.recharged}}" hint-placeholder-val="{{ false }}"><img class="sm-fade" src="assets/avatars/avatar-recharged.webp" alt="Avatar stretching with arms up" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom"></sc-if>
<sc-if value="{{isMood.steady}}" hint-placeholder-val="{{ false }}"><img class="sm-fade" src="assets/avatars/avatar-steady.webp" alt="Avatar relaxing with a cup of chai" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom"></sc-if>
<sc-if value="{{isMood.busy}}" hint-placeholder-val="{{ false }}"><img class="sm-fade" src="assets/avatars/avatar-busy.webp" alt="Avatar working on a laptop" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom"></sc-if>
<sc-if value="{{isMood.stretched}}" hint-placeholder-val="{{ true }}"><img class="sm-fade" src="assets/avatars/avatar-stretched.webp" alt="Avatar rubbing his neck at the desk" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom"></sc-if>
<sc-if value="{{isMood.pause}}" hint-placeholder-val="{{ false }}"><img class="sm-fade" src="assets/avatars/avatar-pause.webp" alt="Avatar resting his head on his hand" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom"></sc-if>
</button>
<button type="button" class="sm-press" onClick="{{openWhy}}" aria-label="Why this state" style="position: absolute; left: 50%; bottom: 10px; margin-left: 110px; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: #ffffff; border: 1.5px solid #06874c; color: #06874c; font-size: 17px; line-height: 1; font-weight: 700; box-shadow: 0 4px 12px -4px rgba(18,22,20,0.25)">?</span>
</button>
</div>

<div style="margin: 0 20px; height: 182px; flex: none; position: relative; z-index: 1">
<sc-for list="{{advs}}" as="a" hint-placeholder-count="1">
<sc-if value="{{a.show}}" hint-placeholder-val="{{ true }}">
<section aria-label="Suggestion" class="sm-enter" style="height: 182px; box-sizing: border-box; padding: 16px; background: #ffffff; border: 1px solid #e4e9e5; border-radius: 16px; box-shadow: 0 10px 24px -14px rgba(18,22,20,0.22); display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.005em">{{a.head}}</p>
<p style="margin: 0; font-size: 15px; line-height: 20px">{{a.body}}</p>
<div style="display: flex; align-items: center; gap: 4px; margin-top: auto">
<button type="button" class="sm-press" onClick="{{a.onCta}}" style="height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #06874c; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer">{{a.cta}}</button>
<button type="button" class="sm-press" onClick="{{notNow}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: transparent; color: #06874c; font-size: 15px; font-weight: 600; cursor: pointer">Not now</button>
</div>
</section>
</sc-if>
</sc-for>
<sc-if value="{{showSnoozed}}" hint-placeholder-val="{{ false }}">
<section aria-label="Suggestion" class="sm-enter" style="height: 182px; box-sizing: border-box; padding: 16px 20px; background: #ffffff; border: 1px solid #e4e9e5; border-radius: 16px; box-shadow: 0 10px 24px -14px rgba(18,22,20,0.22); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 6px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#06874c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5 L11 15.5 L16.5 9.5"></path></svg>
<p style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">{{snoozeText}}</p>
<button type="button" class="sm-press" onClick="{{undoSnooze}}" style="height: 44px; margin-left: -10px; padding: 0 10px; border: 0; border-radius: 12px; background: transparent; color: #06874c; font-size: 15px; font-weight: 600; cursor: pointer">Show suggestion again</button>
</section>
</sc-if>
</div>

<section aria-label="Your signals compared with your usual" style="margin: 12px 20px 0; flex: none; background: #ffffff; border: 1px solid #e4e9e5; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 24px -14px rgba(18,22,20,0.22)">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
<sc-for list="{{signals}}" as="s" hint-placeholder-count="4">
<button type="button" class="sm-press" onClick="{{s.open}}" aria-label="{{s.aria}}" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 0; border-right: {{s.br}}; border-bottom: {{s.bb}}; background: transparent; color: #121614; text-align: left; cursor: pointer">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 6px; width: 100%">
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">{{s.label}}</span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; line-height: 18px">{{s.value}}<span style="font-size: 11px; color: #4f5854"> {{s.unit}}</span></span>
</span>
<span style="display: flex; justify-content: space-between; align-items: center; gap: 6px; width: 100%">
<span style="font-size: 15px; line-height: 20px; font-weight: 600; color: {{s.wordColor}}; transition: color 300ms ease">{{s.word}}</span>
<svg width="56" height="20" viewBox="0 0 56 20" aria-hidden="true">
<rect x="0" y="7" width="56" height="6" rx="2" fill="#eef2ef"></rect>
<path class="sm-draw" d="{{s.d}}" fill="none" stroke="{{s.stroke}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path>
<circle class="sm-fade" cx="{{s.endX}}" cy="{{s.endY}}" r="2.5" fill="{{s.stroke}}"></circle>
</svg>
</span>
</button>
</sc-for>
</div>
</section>

</div>
</sc-if>

<sc-if value="{{showInsights}}" hint-placeholder-val="{{ false }}">
<div class="{{insightsCls}}" style="position: absolute; inset: 0; overflow-y: auto; padding-bottom: 112px; box-sizing: border-box">
<header style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.08em; color: #4f5854">THIS WEEK · 5 TO 11 OCT</p>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Hanken Grotesk', sans-serif; font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -0.03em">Insights</h1>
</header>
<section aria-label="Your week" style="padding: 0 20px; margin-top: 24px">
<p style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.005em">Steady start, stretched from Wednesday, and the weekend brought you back.</p>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 16px">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<button type="button" class="sm-press" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" aria-label="{{d.label}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 76px; padding: 6px 0; border: 0; background: transparent; cursor: pointer">
<span class="sm-ring" style="display: block; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: {{d.bg}}; box-shadow: {{d.ring}}">
<sc-if value="{{d.is.recharged}}" hint-placeholder-val="{{ false }}"><img src="assets/avatars/face-recharged.webp" alt="" style="width: 100%; height: 100%; display: block"></sc-if>
<sc-if value="{{d.is.steady}}" hint-placeholder-val="{{ true }}"><img src="assets/avatars/face-steady.webp" alt="" style="width: 100%; height: 100%; display: block"></sc-if>
<sc-if value="{{d.is.busy}}" hint-placeholder-val="{{ false }}"><img src="assets/avatars/face-busy.webp" alt="" style="width: 100%; height: 100%; display: block"></sc-if>
<sc-if value="{{d.is.stretched}}" hint-placeholder-val="{{ false }}"><img src="assets/avatars/face-stretched.webp" alt="" style="width: 100%; height: 100%; display: block"></sc-if>
<sc-if value="{{d.is.pause}}" hint-placeholder-val="{{ false }}"><img src="assets/avatars/face-pause.webp" alt="" style="width: 100%; height: 100%; display: block"></sc-if>
</span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.08em; color: {{d.color}}">{{d.day}}</span>
</button>
</sc-for>
</div>
<div style="min-height: 64px; margin-top: 8px; padding: 12px 0; border-top: 1px solid #e4e9e5; border-bottom: 1px solid #e4e9e5">
<sc-for list="{{dayCards}}" as="c" hint-placeholder-count="1">
<sc-if value="{{c.show}}" hint-placeholder-val="{{ true }}">
<div class="sm-enter">
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600">{{c.title}}</p>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">{{c.note}}</p>
</div>
</sc-if>
</sc-for>
</div>
</section>

<section aria-label="What drains you" style="padding: 0 20px; margin-top: 36px">
<h2 style="margin: 0 0 8px; font-family: 'Bricolage Grotesque', 'Hanken Grotesk', sans-serif; font-size: 22px; line-height: 26px; font-weight: 600; letter-spacing: -0.02em">What drains you</h2>
<div style="padding: 14px 0; border-top: 1px solid #e4e9e5">
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600">Meetings after 18:00</p>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">On 3 of the 4 days you had them, you ended the day stretched.</p>
</div>
<div style="padding: 14px 0; border-top: 1px solid #e4e9e5">
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600">Under 6 hours of sleep</p>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">Your heart rate ran higher than usual the whole next day.</p>
</div>
<div style="padding: 14px 0; border-top: 1px solid #e4e9e5; border-bottom: 1px solid #e4e9e5">
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600">Lunch at the desk</p>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">Afternoons after a desk lunch stayed busy until you logged off.</p>
</div>
</section>

<section aria-label="What brings you back" style="padding: 0 20px; margin-top: 36px">
<h2 style="margin: 0 0 8px; font-family: 'Bricolage Grotesque', 'Hanken Grotesk', sans-serif; font-size: 22px; line-height: 26px; font-weight: 600; letter-spacing: -0.02em">What brings you back</h2>
<div style="padding: 14px 0; border-top: 1px solid #e4e9e5">
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600">Walks outside</p>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">Your heart rate settled within 8 minutes on most walks.</p>
</div>
<div style="padding: 14px 0; border-top: 1px solid #e4e9e5">
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600">Sleeping before midnight</p>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">You woke up recharged on both nights you did.</p>
</div>
<div style="padding: 14px 0; border-top: 1px solid #e4e9e5; border-bottom: 1px solid #e4e9e5">
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600">Breaks with no work talk</p>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">These settled you faster than breaks spent on calls or chat.</p>
</div>
</section>

<section aria-label="Time you took back" style="padding: 0 20px; margin-top: 36px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Hanken Grotesk', sans-serif; font-size: 22px; line-height: 26px; font-weight: 600; letter-spacing: -0.02em">Time you took back</h2>
<p style="margin: 12px 0 0; font-family: 'Bricolage Grotesque', 'Hanken Grotesk', sans-serif; font-size: 36px; line-height: 40px; font-weight: 600; letter-spacing: -0.03em">{{breakTotalLabel}}</p>
<p style="margin: 4px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">of real breaks, up from 55 min last week</p>
<div role="img" aria-label="{{barsAria}}" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 20px; height: 100px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100px">
<div class="sm-grow" style="width: 100%; max-width: 28px; height: {{b.h}}; border-radius: 4px 4px 0 0; background: {{b.fill}}; animation-delay: {{b.delay}}"></div>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; line-height: 14px; font-weight: 500; color: #4f5854">{{b.day}}</span>
</div>
</sc-for>
</div>
<p style="margin: 20px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">Patterns from your own data. This is guidance, not a medical reading.</p>
</section>
</div>
</sc-if>

<sc-if value="{{showProfile}}" hint-placeholder-val="{{ false }}">
<div class="{{profileCls}}" style="position: absolute; inset: 0; overflow-y: auto; padding-bottom: 112px; box-sizing: border-box">
<header style="padding: 52px 20px 0">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Hanken Grotesk', sans-serif; font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -0.03em">Profile</h1>
<div style="display: flex; align-items: center; gap: 16px; margin-top: 20px">
<span style="display: block; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: #e3f6ea; flex: none"><img src="assets/avatars/face-steady.webp" alt="Your avatar" style="width: 100%; height: 100%; display: block"></span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', 'Hanken Grotesk', sans-serif; font-size: 20px; line-height: 24px; font-weight: 600; letter-spacing: -0.015em">Raj Sonar</span>
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #4f5854">Your usual is learned from the last 14 days</span>
</div>
</div>
</header>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section aria-label="{{g.title}}" style="padding: 0 20px; margin-top: 32px">
<h2 style="margin: 0 0 8px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.08em; color: #4f5854">{{g.eyebrow}}</h2>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<button type="button" class="sm-press" onClick="{{r.open}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #e4e9e5; background: transparent; color: {{r.color}}; text-align: left; cursor: pointer">
<span style="flex: 1; font-size: 15px; line-height: 22px; font-weight: 600">{{r.label}}</span>
<span style="font-size: 15px; line-height: 22px; color: #4f5854">{{r.value}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4f5854" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6 L15 12 L9 18"></path></svg>
</button>
</sc-for>
<div style="border-top: 1px solid #e4e9e5"></div>
</section>

  spark(level, w, h, pad) {
    var wiggle = [0, 0.05, -0.04, 0.06, -0.03, 0.04, -0.05, 0.03, 0.06, -0.02, 0.04, 0];
    var pts = wiggle.map(function (wg, i) {
      var v = 0.5 + wg + level * (i / 11);
      var y = h - pad - v * (h - pad * 2);
      if (y < pad) y = pad;
      if (y > h - pad) y = h - pad;
      return { x: pad + i * ((w - pad * 2) / 11), y: y };
    });
    var d = pts.map(function (p, i) { return (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join(' ');
    var last = pts[pts.length - 1];
    return { d: d, endX: last.x.toFixed(1), endY: last.y.toFixed(1) };
  }

  renderVals() {
    var self = this;
    var S = this.state;
    var D = this.getData();
    var mood = this.mood();
    if (D.KEYS.indexOf(mood) < 0) mood = 'stretched';
    var m = D.MOODS[mood];
    var breakMin = parseInt(S.settings.breakLen, 10) || 10;
    var clock = S.clock || D.TIME[mood];
    var hour = parseInt(clock.split(':')[0], 10);
    var greeting = hour < 12 ? 'Good morning' : (hour < 17 ? 'Good afternoon' : 'Good evening');

    var isMood = {};
    D.KEYS.forEach(function (k) { isMood[k] = k === mood; });
    var heroes = D.KEYS.map(function (k) {
      return { show: k === mood, name: D.MOODS[k].name, sub: D.MOODS[k].sub, color: D.STATECOL[k] };
    });

    var advKey = S.afterBreak ? 'after' : mood;
    var advs = D.KEYS.concat(['after']).map(function (k) {
      var a = k === 'after' ? D.AFTER : D.MOODS[k];
      var body = a.body;
      var cta = a.cta;
      if (k === 'stretched') {
        body = breakMin + ' minutes away from the screen. Walk, and leave the work talk at the desk.';
        cta = 'Take ' + breakMin + ' minutes';
      }
      return { show: !S.snoozed && k === advKey, head: a.head, body: body, cta: cta, onCta: function () { self.onCta(k); } };
    });

    var rows = D.SIG[mood];

        stroke: watch ? '#8a5a00' : '#06874c',
        d: sp.d, endX: sp.endX, endY: sp.endY,
        aria: r[0] + ', ' + r[1] + ' ' + r[2] + ', ' + r[3] + '. Open detail',
        br: i % 2 === 0 ? '1px solid #e4e9e5' : '0',
        bb: i < 2 ? '1px solid #e4e9e5' : '0',
        open: function () { self.openSheet({ sheet: 'sig', sigIndex: i }); }
      };
    });

    var sr = rows[S.sigIndex] || rows[0];
    var big = this.spark(sr[4], 350, 110, 6);
    var sigWatch = sr[5];
    var sig = {
      eyebrow: D.SIGFULL[S.sigIndex] || '',
      word: (sigWatch ? (sr[4] < 0 ? '↓ ' : '↑ ') : '') + sr[3],
      wordColor: sigWatch ? '#8a5a00' : '#121614',
      stroke: sigWatch ? '#8a5a00' : '#06874c',
      value: sr[1], unit: sr[2], d: big.d, endX: big.endX, endY: big.endY,

    var whyReasons = D.WHY[mood].map(function (t, i) {

    });

    // break
    var total = S.breakTotal || 600;
    var el = Math.min(S.elapsed, total);
    var rem = Math.max(0, total - el);
    var mm = Math.floor(rem / 60);
    var ss = Math.floor(rem % 60);
    var timer = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
    var prog = total ? el / total : 0;
    var sm = D.SIG[S.startMood] || D.SIG.stretched;
    var hr0 = parseFloat(sm[0][1]);
    var hrv0 = parseFloat(sm[1][1]);
    var br0 = parseFloat(sm[2][1]);

    var brA = Math.round(br0 - Math.max(0, br0 - 15) * settle);

    var doneRows = [

      { label: 'Breathing', before: String(br0), after: String(brA), unit: '/min', delay: '180ms' },
      { label: 'Heart rate variability', before: String(hrv0), after: String(hrvA), unit: 'ms', delay: '240ms' }
    ];
    var feelOpts = ['Lighter', 'About the same', 'Still wound up'].map(function (l) {

    });

    // insights
    var week = D.WEEK.map(function (d, i) {

    }
    var groups = [
      { title: 'Connected', eyebrow: 'CONNECTED', rows: [
        infoRow('Apple Watch', 'Connected', 'watch'),
        infoRow('Apple Health', 'Sleep, workouts', 'health'),
        infoRow('Calendar', 'Meeting times', 'calendar')
      ] },
      { title: 'Your work rhythm', eyebrow: 'YOUR WORK RHYTHM', rows: [

        optRow('Working days', 'days'),
        optRow('Break length', 'breakLen'),
        optRow('Nudges', 'nudges'),
        optRow('Quiet hours', 'quiet')
      ] },
      { title: 'Privacy', eyebrow: 'PRIVACY', rows: [
        infoRow('Where your data lives', 'On this phone', 'data'),
        { label: 'Export my data', value: '', color: '#121614', open: function () { self.showToast('Your export is ready in Files.'); } },
        infoRow('Delete my data', '', 'del', true)
      ] }
    ];

    var opt = S.optKey ? D.OPTS[S.optKey] : null;
    var optItems = opt ? opt.options.map(function (o) {
      var on = S.settings[S.optKey] === o;
      return {
        label: o, checked: on ? 'true' : 'false', opacity: on ? '1' : '0', weight: on ? '700' : '500',
        pick: function () {
          var next = {};
          for (var k in S.settings) next[k] = S.settings[k];
          next[S.optKey] = o;
          self.setState({ settings: next });
        }
      };
    }) : [];
    var info = S.info ? D.INFO[S.info] : null;

    var sheetTitle = '';
    if (S.sheet === 'opt' && opt) sheetTitle = opt.title;
    else if (S.sheet === 'info' && info) sheetTitle = info.title;
    else if (S.sheet === 'sig') sheetTitle = sr[0];
    else if (S.sheet === 'why') sheetTitle = 'Why ' + m.name;

    function tabCls(t) {
      if (S.tab === t) return S.tabDir === 'back' ? 'sm-in-back' : (S.tabDir === 'fwd' ? 'sm-in-fwd' : 'sm-enter');
      if (S.leaving === t) return S.tabDir === 'back' ? 'sm-out-back' : 'sm-out-fwd';

  function fit() {
    var small = window.innerWidth <= 430;
    var s = small ? window.innerWidth / 390 : Math.min(1, (window.innerHeight - 48) / 844);
    phone.style.transform = s < 1 || small ? 'scale(' + s + ')' : '';
    phone.style.marginBottom = (s < 1 || small) ? (844 * (s - 1)) + 'px' : '';
  }
  window.addEventListener('resize', fit);
  fit();
  mountApp(Component, props, phone);
})();
</script>
</body>
</html>
