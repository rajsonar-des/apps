<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIVE App · Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --text: #1F1F1F;
    --muted: #5F6368;
    --line: #DADCE0;
    --blue: #4285F4;
    --red: #EA4335;
    --yellow: #FBBC05;
    --green: #34A853;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #202124;
      --text: #E8EAED;
      --muted: #9AA0A6;
      --line: #3C4043;
    }
  }
  :root[data-theme="dark"] {
    --bg: #202124;
    --text: #E8EAED;
    --muted: #9AA0A6;
    --line: #3C4043;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  main {
    text-align: center;
    max-width: 560px;
    width: 100%;
  }
  svg { width: 140px; height: auto; }
  h1 {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin: 24px 0 8px;
  }
  .tagline {
    font-size: 20px;
    color: var(--muted);
    margin: 0 0 32px;
  }
  .badge {
    display: inline-block;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #0D652D;
    background: #E6F4EA;
    border: 1px solid #34A853;
    border-radius: 999px;
    padding: 8px 16px;
  }
  p.note {
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
    margin: 24px 0 0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .badge { color: #81C995; background: #1E3A28; }
  }
  :root[data-theme="dark"] .badge { color: #81C995; background: #1E3A28; }
  @media (max-width: 480px) {
    h1 { font-size: 40px; }
    .tagline { font-size: 18px; }
  }
</style>
</head>
<body>
<main>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="-54 -52 108 104" role="img" aria-label="HIVE mark">
    <g stroke-linejoin="round" stroke-width="2">
      <polygon transform="translate(-34.64,-30)" points="0,-17 14.72,-8.5 14.72,8.5 0,17 -14.72,8.5 -14.72,-8.5" fill="#4285F4" stroke="#4285F4"/>
      <polygon transform="translate(34.64,-30)" points="0,-17 14.72,-8.5 14.72,8.5 0,17 -14.72,8.5 -14.72,-8.5" fill="#EA4335" stroke="#EA4335"/>
      <polygon transform="translate(-17.32,0)" points="0,-17 14.72,-8.5 14.72,8.5 0,17 -14.72,8.5 -14.72,-8.5" fill="#FBBC05" stroke="#FBBC05"/>
      <polygon transform="translate(17.32,0)" points="0,-17 14.72,-8.5 14.72,8.5 0,17 -14.72,8.5 -14.72,-8.5" fill="#34A853" stroke="#34A853"/>
      <polygon transform="translate(-34.64,30)" points="0,-17 14.72,-8.5 14.72,8.5 0,17 -14.72,8.5 -14.72,-8.5" fill="#4285F4" stroke="#4285F4"/>
      <polygon transform="translate(34.64,30)" points="0,-17 14.72,-8.5 14.72,8.5 0,17 -14.72,8.5 -14.72,-8.5" fill="#EA4335" stroke="#EA4335"/>
    </g>
  </svg>
  <h1>HIVE</h1>
  <p class="tagline">One institute. Many minds. Shared growth.</p>
  <span class="badge">Coming soon</span>
  <p class="note">The HIVE prototype will be published here. Built by Raj Sonar, Interaction Design, National Institute of Design, Bengaluru.</p>
</main>
</body>
</html>
